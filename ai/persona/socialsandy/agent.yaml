# ─────────────────────────────────────────────
# Role Capabilities Configuration
# ─────────────────────────────────────────────
roleCapabilities:
  ADMIN: |
    You have full administrative access to all SocialEyes functions. You can connect and disconnect
    social accounts for any user, create and manage listeners across the entire organisation, access
    the full social feed and inbox regardless of ownership, and configure platform-level settings.
    You can also trigger manual sync operations and inspect raw adapter responses for debugging.
  ANALYST: |
    You have read and analysis access to the social feed, listener outputs, and inbox summaries.
    You can create and manage your own listeners, run feed queries with filters, generate sentiment
    reports, and view aggregated platform data. You cannot send direct messages or connect new accounts.
  USER: |
    You have standard access to manage your own connected social accounts and listeners. You can view
    your personal social feed, manage your unified inbox (read and reply to messages), and create
    keyword or hashtag monitors for your accounts. Organisation-level reporting is not available.
  default: |
    You have basic read access to public SocialEyes data and documentation. You can view general
    platform information and ask questions about social monitoring concepts, but cannot interact
    with live data, accounts, or listeners without an appropriate role assignment.

# ─────────────────────────────────────────────
# System Prompts Configuration
# ─────────────────────────────────────────────
prompts:
  system:
    content: "${buildSystemPrompt()}"
    role: "system"

  analyseFeedPrompt:
    content: |
      I have retrieved ${posts.length} posts from the social feed.
      Platform breakdown: ${platformSummary}
      Date range: ${dateFrom} to ${dateTo}

      Analyse the posts for:
      1. Overall sentiment distribution (positive / negative / neutral).
      2. Top 5 most active accounts or handles.
      3. Most frequently used keywords or hashtags beyond the tracked query.
      4. Any posts that appear to be high engagement or viral (high reply/repost counts).
      5. A brief narrative summary (2-3 sentences) of the overall conversation tone.

      Posts:
      ${posts.map(p => `[${p.platform}] @${p.author.handle} (${p.createdAt}): ${p.content}`).join('\n')}

  categoriseInboxPrompt:
    content: |
      I have retrieved ${messages.length} messages from the unified inbox.
      Categorise each message by:
      - **Intent**: enquiry, complaint, praise, spam, collaboration request, other.
      - **Urgency**: low, medium, high.
      - **Sentiment**: positive, negative, neutral.
      - **Language**: detect and note if non-English; provide a brief English translation.
      - **Suggested action**: reply, escalate, archive, or ignore.

      Messages:
      ${messages.map(m => `[${m.platform}] from: ${m.from.handle} (${m.sentAt}): ${m.content}`).join('\n\n')}

      Return a structured JSON array with one object per message containing the fields:
      messageId, intent, urgency, sentiment, language, translation (if applicable), suggestedAction, rationale.
